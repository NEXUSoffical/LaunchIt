<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body {
      width: 280px;
      margin: 0;
      padding: 16px;
      background: #0e131d;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }
    .header img {
      width: 32px;
      height: 32px;
      border-radius: 8px;
    }
    .title {
      font-size: 16px;
      font-weight: 800;
    }
    .tagline {
      font-size: 10px;
      color: #ff8c37;
      font-weight: 600;
    }
    .status-card {
      background: rgba(20, 241, 149, 0.1);
      border: 1px solid rgba(20, 241, 149, 0.3);
      border-radius: 10px;
      padding: 10px;
      font-size: 12px;
      color: #14f195;
      text-align: center;
      margin-bottom: 12px;
    }
    .info {
      font-size: 12px;
      color: #94a3b8;
      line-height: 1.4;
      margin-bottom: 14px;
    }
    .btn {
      width: 100%;
      box-sizing: border-box;
      display: block;
      padding: 10px;
      border-radius: 8px;
      background: linear-gradient(135deg, #ff6000 0%, #ff8c37 100%);
      color: #fff;
      text-decoration: none;
      text-align: center;
      font-size: 13px;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="header">
    <img src="icon.jpg" alt="Logo" />
    <div>
      <div class="title">LAUNCH<span style="color: #ff6000;">IT</span></div>
      <div class="tagline">— see it launch it —</div>
    </div>
  </div>

  <div class="status-card">
    ● Active on TikTok
  </div>

  <div class="info">
    Scroll any video on TikTok and click the <b>LaunchIt button</b> right beside the Like & Share buttons to launch it instantly on Solana!
  </div>

  <a class="btn" href="https://launchit.world" target="_blank">
    Open LaunchIt.world
  </a>
</body>
</html>
